<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai editor</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#FAFAF9;--panel:#FFFFFF;--ink:#0C0A09;--t2:#57534E;--t3:#78716C;--t4:#A8A29E;--line:#E7E5E4;--soft:#F5F5F4;--ring:#D6D3D1;
  --onink:#FFFFFF;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
/* dark: the OS setting until the user picks with the header switch (html[data-theme]), as on the review page */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#100E0E;--panel:#161413;--ink:#F2F0EB;--t2:rgba(242,240,235,.80);--t3:rgba(242,240,235,.58);--t4:rgba(242,240,235,.42);
  --line:rgba(255,255,255,.10);--soft:rgba(255,255,255,.06);--ring:rgba(255,255,255,.22);--onink:#100E0E;color-scheme:dark}}
:root[data-theme=dark]{--bg:#100E0E;--panel:#161413;--ink:#F2F0EB;--t2:rgba(242,240,235,.80);--t3:rgba(242,240,235,.58);--t4:rgba(242,240,235,.42);
  --line:rgba(255,255,255,.10);--soft:rgba(255,255,255,.06);--ring:rgba(255,255,255,.22);--onink:#100E0E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/20px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink);text-decoration:underline 1px;text-underline-offset:3px}
.app{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 28px;flex-shrink:0;gap:16px}
.brandrow{display:flex;align-items:center;gap:18px;width:260px;flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
.brand b{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.brand span{font-size:14px;color:var(--t3)}
.steps{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:12px}
.step{display:flex;gap:8px;align-items:center;padding:7px 14px;border-radius:9px;border:0;background:none;color:var(--t4);font-size:14px;line-height:18px}
.step i{font-style:normal;font-size:13px}
.step.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0C0A0914}
.step.done{color:var(--t2)}
.step:disabled{cursor:default}
.bars{display:none}
.live{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center;justify-content:flex-end;width:260px;flex-shrink:0;font-size:13px;line-height:16px;color:var(--t3);text-align:right}
.live.on{color:var(--ink)}
.lstrip{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;overflow:hidden;color:var(--ink)}
.lstrip.lgo{cursor:pointer}
.lstrip .ltxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lstrip .lclk{color:var(--t3);font-variant-numeric:tabular-nums;flex-shrink:0}
.live.busy::before{display:none}
.live.busy{width:auto;max-width:440px;min-width:260px}
.ncard,.vrow.vopen{cursor:pointer;transition:border-color .15s,background .15s}
.ncard:hover,.ncard:focus-visible{border-color:var(--ring)}
.vrow.vopen:hover,.vrow.vopen:focus-visible{background:var(--soft)}
.ncard .th,.vrow .th{position:relative;overflow:hidden}
.mkover{position:absolute;inset:auto 6px 6px 6px;display:flex;align-items:flex-start;gap:6px;background:#0C0A09b8;color:#fff;border-radius:8px;padding:5px 7px;font-size:11px;line-height:14px}
.mkover .spin{margin-top:2px;width:10px;height:10px;border-width:1.5px;border-color:#ffffff40;border-top-color:#fff}
.vrow .th .mkover{inset:auto 3px 3px 3px;padding:3px;justify-content:center}
.sgroup{display:flex;flex-direction:column;gap:14px}
.sgroup>.gh{display:flex;align-items:baseline;gap:10px}
.scard.new{background:color-mix(in srgb,var(--panel) 88%,#F5C400)}
.newtag{position:absolute;top:10px;right:10px;background:#F5C400;color:#0C0A09;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;line-height:16px}
.scard.flash{animation:flash 1.6s ease-out}
.basechip{display:inline-flex;align-items:center;gap:8px;margin:2px 6px 0;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--t2);align-self:flex-start}
.basechip i{width:22px;height:22px;border-radius:11px;background:#45403C center/cover;flex-shrink:0}
.frow .was{color:var(--t4);font-size:12px;margin-left:6px}
.frow .chg{color:var(--ink);font-weight:600}
.live.on::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--ink);flex-shrink:0}
main{flex:1;display:flex;gap:20px;padding:12px 20px 20px;min-height:0}
.col{display:flex;flex-direction:column;flex-shrink:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.grow{flex:1 1 0;min-width:0}
h1{margin:0;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
.lede{font-size:16px;line-height:24px;color:var(--t2);margin:14px 0 0}
.h{font-size:15px;line-height:18px;font-weight:600;color:var(--ink)}
.sub{color:var(--t2);font-size:14px;line-height:21px}
.muted{color:var(--t3);font-size:13px;line-height:16px}
.faint{color:var(--t4)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.check{width:16px;display:flex;justify-content:center;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:4px;background:var(--ink)}
.ring{width:7px;height:7px;border-radius:4px;border:1.5px solid var(--ring)}
.btn{white-space:nowrap;height:42px;padding:0 22px;border-radius:12px;border:1px solid var(--ink);background:var(--panel);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--ink);color:var(--onink)}
.btn.quiet{border-color:var(--line);background:var(--bg);color:var(--t2);font-weight:500;padding:0 18px}
.btn:disabled{opacity:.45;cursor:default}
.wide{width:100%;height:58px;border-radius:14px;font-size:16px}
.input{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px;font:13px/16px var(--mono);color:var(--ink);flex:1;min-width:0}
.input:focus{outline:none;border:1.5px solid var(--ink)}
.small{height:40px;width:96px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;color:var(--t2);flex-shrink:0}
.small.dark{background:var(--ink);border-color:var(--ink);color:var(--onink);font-weight:600}
.lock{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px;line-height:16px;flex-shrink:0}
.krow{display:flex;gap:28px;padding:18px 24px;border-top:1px solid var(--line)}
.krow.focus{background:var(--bg)}
.kl{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.kr{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.kname{font-size:15px;line-height:20px;font-weight:600}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--t3)}
.msg.ok,.msg.bad{color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--line);margin-top:auto}
.mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--t3)}
.big-input{display:flex;align-items:center;gap:10px;height:72px;border:1.5px solid var(--ink);border-radius:14px;background:var(--panel);padding:0 16px 0 22px}
.big-input input{flex:1;min-width:0;border:0;outline:0;font:17px/24px system-ui,sans-serif;background:none;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:8px;padding:5px 10px;font-size:14px;line-height:18px;flex-shrink:0;border:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;background:var(--soft);color:var(--t2);font-size:16px;display:inline-flex;gap:8px;align-items:center}
.chip.on{background:var(--panel);border:1.5px solid var(--ink);color:var(--ink);font-weight:600}
.likes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.like{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.like b{display:block;font-size:15px;line-height:20px;font-weight:600}.like span{font-size:13px;line-height:18px;color:var(--t3)}
.like .box{width:20px;height:20px;border-radius:6px;margin-top:1px}
.like.on{border:1.5px solid var(--ink);padding:13.5px 15.5px}.like.on .box{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 1px repeat(2,minmax(0,1fr));gap:10px 10px;padding:0 24px 24px;align-items:start}
.glabel{font-size:13px;line-height:16px;color:var(--t3);grid-column:1/6}.glabel b{color:var(--ink);font-weight:600}
.glabel.g2{grid-column:7/9;grid-row:1}.tdiv{grid-column:6;grid-row:1/3;background:var(--line);align-self:stretch;margin:0 4px}
.tile.m0{grid-column:7;grid-row:2}.tile.m1{grid-column:8;grid-row:2}
.tile .pic{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#45403C center/cover no-repeat}
.tile .badge{position:absolute;top:8px;right:8px;background:var(--panel);border-radius:6px;padding:2px 7px;font-size:13px;font-weight:600;line-height:18px}
.tile .views{position:absolute;left:10px;bottom:9px;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 3px #0008}
.tile .tdur{font-size:12px;line-height:16px;color:var(--t4);margin-top:6px}
.mrow{display:grid;grid-template-columns:134px 1fr;gap:0 0;padding:14px 20px;border-radius:14px}
.mrow .k{color:var(--t3);font-size:14px}
.mrow .v{font-size:17px;line-height:26px;color:var(--t2)}
.mrow.now{background:var(--soft)}
.mrow.now .k{color:var(--ink);font-weight:600}
.mrow.now .v{color:var(--ink)}
.mrow.next .v,.mrow.next .k{color:var(--t4)}
.slist{display:flex;flex-direction:column;gap:13px;font-size:14px;line-height:18px}
.slist .row{gap:12px}
.slist .t{flex:1;color:var(--t2)}
.slist .s{color:var(--t4);font-size:13px}
.slist .cur .t{color:var(--ink);font-weight:600}
.slist .later .t{color:var(--t4)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;width:166px;flex-shrink:0}
.prog div{height:4px;background:var(--ink)}
.cost{border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.cost .between{font-size:14px;color:var(--t2)}
.cost b{color:var(--ink)}
.strip{display:grid;gap:10px;padding:14px 24px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.strip .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.strip .bar div{height:6px;background:var(--ink)}
.strip span{font-size:13px;color:var(--t3)}
.strip .cur span{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats>div{padding:24px 0 22px 28px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font-size:56px;line-height:60px;font-weight:700;letter-spacing:-.03em}
.stats span{color:var(--t2);font-size:14px}
.facts{display:grid;grid-template-columns:110px 1fr;gap:14px 26px;font-size:15px;line-height:22px}
.facts .k{color:var(--t3);font-size:14px}
.facts .k.b{color:var(--ink);font-weight:600}
.pick{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ring);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--panel)}
.pick.on .box{border-color:var(--ink)}
.pick .ttl{font-weight:600;font-size:15px}
.pick:not(.on) .ttl{font-weight:400;color:var(--t2)}
.dash{display:flex;gap:14px;font-size:14px;line-height:19px;color:var(--t2);padding:6px 0}
.dash::before{content:"";width:10px;height:1.5px;background:var(--t3);margin-top:9px;flex-shrink:0}
.prompt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 28px;border-top:1px solid var(--line)}
.prompt code{font:15px/20px var(--mono);color:var(--ink)}
.copy{height:40px;min-width:92px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--t2);flex-shrink:0}
.tool{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.drop{flex:1;border:1.5px dashed var(--ring);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:280px;background:none;width:100%}
.drop.over{border-color:var(--ink);background:var(--panel)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px}
.seg button{flex:1;height:40px;border:0;border-radius:9px;background:none;color:var(--t3);font-size:15px}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0C0A0914}
.file{display:flex;align-items:center;gap:16px;border:1.5px solid var(--ink);border-radius:16px;padding:14px 20px;background:var(--panel)}
.empty{color:var(--t3);font-size:14px;line-height:21px;padding:24px}
.hide{display:none!important}
.tick{width:18px;height:18px;border-radius:9px;background:#16A34A;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tick svg{width:10px;height:10px}
.todo{width:18px;height:18px;border-radius:9px;border:1.5px solid var(--ring);flex-shrink:0}
.logo{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--t2)}
/* returning user: New video, Pick a style, Making, Home, Your videos, My style, Settings (Paper "J launcher + pick") */
.tabs{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:12px}
.tabs button{padding:7px 16px;border-radius:9px;border:0;background:none;color:var(--t4);font-size:14px;line-height:18px}
.tabs button.on{background:var(--panel);color:var(--ink);font-weight:600}
.hlink{white-space:nowrap;flex-shrink:0;border:0;background:none;color:var(--t3);font-size:13px;line-height:16px;padding:0}
.pill{border-radius:999px;padding:7px 14px;background:var(--soft);color:var(--t2);font-size:13px;line-height:16px;border:1px solid transparent}
.pill.on{background:var(--panel);border-color:var(--ink);color:var(--ink);font-weight:500;padding:6px 13px}
.choose{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--ring);border-radius:10px;background:var(--panel);font-weight:500;cursor:pointer;flex-shrink:0}
.grid{display:flex;flex-wrap:wrap;gap:16px 12px}
.clip{position:relative;width:108px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.upic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;color:#fff;font-size:12px;line-height:16px;text-align:center}
.upbar{width:80%;height:4px;border-radius:2px;background:#ffffff40;overflow:hidden}.upbar div{height:4px;background:#fff;transition:width .2s}
.clip.flash .pic{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--ink)}100%{box-shadow:0 0 0 0 transparent}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--onink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.on{opacity:1}
#dropov{position:fixed;inset:12px;border:2px dashed var(--ink);border-radius:20px;background:color-mix(in srgb,var(--bg) 88%,transparent);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:22px;font-weight:600;z-index:40;pointer-events:none}
body.dragging #dropov{display:flex}
.clip .pic{position:relative;width:108px;height:192px;border-radius:10px;overflow:hidden;background:#45403C center/cover no-repeat}
.clip.on .pic{outline:2px solid var(--ink);outline-offset:2px}
.clip .ring2{position:absolute;right:7px;top:7px;width:20px;height:20px;border-radius:10px;border:1.5px solid #fff;background:#0C0A0940}
.clip .num{position:absolute;right:6px;top:6px;height:22px;border-radius:11px;background:var(--ink);color:var(--onink);display:flex;align-items:center;gap:3px;padding:0 7px 0 6px;font-size:12px;font-weight:700}
.clip .dur{position:absolute;left:7px;bottom:6px;color:#fff;font-size:11px;font-weight:600;line-height:14px;text-shadow:0 1px 3px #0009}
.clip .nm{font-size:12px;line-height:16px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.on .nm{font-weight:600;color:var(--ink)}
.clip .wh{font-size:12px;line-height:16px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.clip .more{position:absolute;left:6px;top:6px;width:26px;height:26px;border-radius:13px;border:0;background:#0C0A09a6;color:#fff;display:grid;place-items:center;padding:0;opacity:0;font-size:14px;line-height:1}
.clip:hover .more,.clip .more:focus-visible,.clip.menu .more{opacity:1}
@media (hover:none){.clip .more{opacity:1}}
.cmenu{position:absolute;left:6px;top:36px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0C0A0926;padding:4px;display:flex;flex-direction:column;min-width:160px}
.cmenu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink);white-space:nowrap}
.cmenu button:hover{background:var(--soft)}
.droptile{width:108px;height:192px;border:1.5px dashed var(--ring);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 10px;text-align:center;flex-shrink:0;cursor:pointer}
.droptile.over{border-color:var(--ink)}
.scr{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:13px;line-height:18px;color:var(--t2)}
.scr div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;flex-direction:column;gap:12px;padding:20px 24px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:22px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:left;width:100%}
.opt.on{border:1.5px solid var(--ink)}
.radio{width:18px;height:18px;border-radius:9px;border:1.5px solid var(--ring);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.on>.radio,.radio.on{border-color:var(--ink)}.on>.radio::after,.radio.on::after{content:"";width:9px;height:9px;border-radius:5px;background:var(--ink)}
.rec{background:var(--soft);border-radius:999px;padding:2px 8px;font-size:12px;line-height:16px;color:var(--t2)}
.order{display:flex;gap:10px;flex-wrap:wrap}
.order>div{flex:1 1 120px;display:flex;align-items:center;gap:10px;padding:8px;background:var(--soft);border-radius:12px;cursor:grab;min-width:0}
.order .th{width:36px;height:64px;border-radius:6px;background:#45403C center/cover;flex-shrink:0}
.shape{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:left}
.shape.on{border:1.5px solid var(--ink)}
.shape i{display:block;border:2px solid var(--t4);border-radius:4px}.shape.on i{border-color:var(--ink)}

let themeAt=0;   // a poll already in flight still carries the old theme: ignore the server's for 3 s after a click
function toggleTheme(){const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;themeAt=Date.now();post('/theme',{theme:t});render()}
// the theme is one setting ($AI_EDITOR_HOME/ui.json): a choice made on a review page shows here on the next poll
function applyTheme(t){const h=document.documentElement;if(t==='light'||t==='dark'){if(h.dataset.theme!==t)h.dataset.theme=t}else delete h.dataset.theme}
OS.addEventListener('change',()=>render());
function go(n){view=n;try{localStorage.setItem('ave-home-view',n)}catch(e){}render()}
function autoView(){
  const td=latest('teardown'),sk=latest('skill'),vd=latest('video');
  if(vd)return 4; if(sk)return 3; if(td&&td.state!=='cancelled')return 2;
  return S.setup_skipped?1:0;
}
function reached(){const a=autoView();return Math.max(a,view??0)}

function busyJob(){return S.jobs.filter(j=>j.state==='taken').pop()||S.jobs.filter(j=>j.state==='queued').pop()}   // the one being worked on first
// a spinner, the newest step (Claude's or a script's own), and a clock since anything last arrived
function liveStrip(){
  const j=busyJob();if(!j)return '';
  if(j.state==='queued')return S.listening?`<span class="lstrip"><span class="spin"></span><span class="ltxt">Claude is picking this up</span></span>`:`<span class="ltxt">Waiting for Claude. Type ${CMD} in Terminal.</span>`;
  const s=j.steps.at(-1),last=Math.max(j.u||0,s?s.t||0:0,S.claude_seen||0)||jobStart(j),age=Math.max(0,Math.round(Date.now()/1000-last));
  if(!S.listening&&age>60)return `<span class="ltxt">Claude is not listening. Type ${CMD} in Terminal.</span>`;
  const txt=age>60?`Still working: ${s?s.text:'getting started'}. First runs take longer.`:s?s.text+(s.detail&&!s.done?' · '+s.detail:''):'Claude is on it';
  return `<span class="lstrip" title="${esc(txt)}"><span class="spin"></span><span class="ltxt">${esc(txt)}</span><span class="lclk" data-since="${last}">${secs(age)}</span></span>`;
}
function header(v){
  const r=reached();
  $('#steps').innerHTML=STEPS.map((s,i)=>`<button class="step ${i===v?'on':i<r||i<v?'done':''}" ${i<=r?'':'disabled'} onclick="go(${i})">${i<v||(i<r&&i!==v)?CHECK:`<i>${i+1}</i>`}${s}</button>`).join('');
  $('#bars').innerHTML=STEPS.map((s,i)=>`<div class="${i===v?'on':i<v?'done':''}"></div>`).join('');
  const td=latest('teardown');$('#homebtn').classList.toggle('on',v===0);
  const live=$('#live');let t='',on=false;
  const strip=liveStrip();
  if(strip){live.innerHTML=strip+themeBtn();live.className='live busy';return}
  if(v===2&&td&&td.state==='done'){t=`Done in ${secs(Math.round(td.finished-td.started))}`}
  else if(v===4&&td&&td.state==='done'){const sk=latest('skill');t='Style: '+((sk&&sk.result.name)||'@'+td.args.handle)}
  else t=S.listening?'Claude is listening':'';
  live.innerHTML=`<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0" title="${esc(t)}">${esc(t)}</span>${themeBtn()}`;live.className='live'+(on?' on':'');
}

function readyPct(){const j=latest('setup'),s=j&&j.steps.at(-1);return j&&j.state==='done'?100:Math.round(((s&&s.progress)||0)*100)}

async function skip(names){await post('/later',{names});if(names.length>1)go(1);else load()}
async function queue(b){const r=await post('/job',b);if(!r._ok)alert(r.msg||r.error||'That did not work.');await load();return r}

// ---------------------------------------------------------------- several links, one row each
// Each pasted link is a row (platform logo, a short form, remove). A profile or a bare handle is the only row.
const LB={};const lbOf=k=>LB[k]||(LB[k]={rows:[],draft:''});
const PLUS='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const LINKG='<span class="logo" style="color:var(--t3)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>';
const platOf=u=>/tiktok\.com/i.test(u)?'tiktok':/youtu\.?be/i.test(u)?'youtube':/instagram\.com/i.test(u)?'instagram':null;
const isLink=u=>/[./]/.test(u);
const isProfile=u=>!isLink(u)||/(tiktok|youtube)\.com\/@[\w.-]+\/?(\?.*)?$/i.test(u)||/instagram\.com\/(?!(reels?|p|tv)\/)[\w.]+\/?(\?.*)?$/i.test(u);
const shortLink=u=>isLink(u)?u.replace(/^https?:\/\/(www\.|m\.|vm\.)?/i,'').replace(/\?.*$/,'').replace(/\/$/,''):'@'+u.replace(/^@/,'');
const lbText=k=>{const b=lbOf(k);return [...b.rows,b.draft.trim()].filter(Boolean).join(' ')};
function lbAdd(k,text){
  const b=lbOf(k);
  for(const t of text.split(/\s+/).filter(Boolean)){if(isProfile(t))b.rows=[t];else{b.rows=b.rows.filter(r=>!isProfile(r));if(!b.rows.includes(t))b.rows.push(t)}}
  b.draft='';const e=$('#lb-'+k);if(e)e.value='';lbChanged(k);
}
function lbChanged(k){if(k==='paste')onPaste(lbText(k));render()}
function lbRemove(k,i){lbOf(k).rows.splice(i,1);lbChanged(k);const e=$('#lb-'+k);if(e)e.focus()}
function lbInput(k,v){lbOf(k).draft=v;if(k==='paste')onPaste(lbText(k))}
function lbKey(e,k){
  const b=lbOf(k),v=e.target.value;
  if(e.key==='Enter'){e.preventDefault();if(v.trim())lbAdd(k,v);else if(k==='study')studyLink()}
  else if(e.key==='Backspace'&&!v&&b.rows.length){e.preventDefault();b.rows.pop();lbChanged(k)}
}
function lbPaste(e,k){const t=(e.clipboardData||{getData:()=>''}).getData('text');if(!t.trim())return;e.preventDefault();lbAdd(k,e.target.value+' '+t)}
function linkBox(k,big){
  const b=lbOf(k),n=b.rows.length,px=big?20:18;
  const rows=b.rows.map((r,i)=>`<div class="lrow">${platOf(r)?logo(platOf(r),px):LINKG}<span class="lurl" title="${esc(r)}">${esc(shortLink(r))}</span><button class="lx" aria-label="Remove this link" title="Remove" onclick="lbRemove('${k}',${i})">${CROSS}</button></div>`).join('');
  const prof=n&&isProfile(b.rows[0]);
  const ph=prof?'Or paste video links instead':`Video ${n+1}: paste a link`;
  // empty numbered boxes up to 6 (or more after "Add more links"): several links is the point, so show it
  const slots=prof?0:Math.max(0,Math.max(6,n+1+(b.extra||0))-n-1);
  const empty=Array.from({length:slots},(_,i)=>`<div class="lrow lslot" onclick="const e=document.getElementById('lb-${k}');if(e)e.focus()"><span class="lnum">${n+2+i}</span><span>Video ${n+2+i}</span></div>`).join('');
  const hint=prof?'':`<div class="fmtq"><button class="hlink" style="font-size:13px;color:var(--t2)" onclick="ui.fmtq=!ui.fmtq;render()">What counts as the same format? ${ui.fmtq?'▴':'▾'}</button>${ui.fmtq?'<ul><li>The same kind of video: talking head, skit or tutorial</li><li>The same captions look</li><li>The same layout</li><li>Roughly the same length</li></ul>':''}</div>`;
  return `${hint}<div class="lbox ${big?'big':''}">${rows}<label class="lrow ladd"><span class="logo">${n?PLUS:`<span class="lnum">1</span>`}</span><input id="lb-${k}" placeholder="${ph}" value="${esc(b.draft)}" oninput="lbInput('${k}',this.value)" onkeydown="lbKey(event,'${k}')" onpaste="lbPaste(event,'${k}')" autocomplete="off" spellcheck="false"></label>${empty}</div>${prof?'':`<div class="muted" style="margin-top:8px;font-size:13px">or paste a creator's profile and we pick their videos in one format</div><button class="lmore" onclick="lbOf('${k}').extra=(lbOf('${k}').extra||0)+1;render();const e=document.getElementById('lb-${k}');if(e)e.focus()">${PLUS} Add more links</button>`}`;
}
function lbCount(k){
  const v=lbOf(k).rows.filter(r=>!isProfile(r));
  return v.length?`${v.length} of 6 videos.${v.length<6?' More links give a truer style.':' Enough for a good read.'}${v.some(r=>platOf(r)==='instagram')?' Instagram ranks by likes, not views.':''}`:'';
}

// ---------------------------------------------------------------- H3 / H4
function curVideo(td){const s=td.steps.filter(s=>!s.done).at(-1)||{};const m=/video (\d+) of (\d+)/.exec(s.detail||'');return m?[+m[1],+m[2]]:null}
// creator-teardown's format check (format.json): the links that look like another format, left out
const leftOut=td=>{const f=td.format;return f&&f.consistent===false&&Array.isArray(f.left_out)?f.left_out:[]};
function fmtLine(td){
  const lo=leftOut(td);if(!lo.length)return '';const k=(td.format.kept||[]).length,n=k+lo.length;
  return `<div class="msg" style="margin-top:16px;font-size:14px;line-height:20px"><span>Using ${k} of ${n}: ${lo.length} look${lo.length>1?'':'s'} like a different format${lo.some(x=>x.why)?` (${esc(lo.map(x=>x.why).filter(Boolean).join(', '))})`:''}.</span></div>`;
}
function h3(td){
  const lk=td.listing,m=td.measured||{rows:{}},cv=curVideo(td),n=lk?lk.videos.length:0;

function stepList(steps,plan,start,waiting){

  plan.filter(p=>!seen.has(p)).forEach(p=>rows.push(`<div class="row later"><div class="check"><div class="ring"></div></div><span class="t">${esc(p)}</span></div>`));

  if(c.id!=='mine')return `<div class="sub" style="padding:8px 6px 4px;font-size:14px;line-height:21px">${esc(c.id)}'s style${c.videos?`, measured from ${c.videos} of their videos`:''}. Pick it to edit exactly like them.</div><div class="muted" style="padding:0 6px 10px;font-size:13px">Made ${madeAgo(c.made)||'here'}</div>`;
  const b=c.base&&(L.styles.find(x=>x.id==='@'+c.base)||{}),was=Object.fromEntries((b&&b.facts)||[]);
  const n=Math.max(c.changes||0,b?c.facts.filter(([k,v])=>was[k]!=null&&was[k]!==v).length:0);   // a changed number counts even before its rule is written

  if(r.kind!=='creator'||(!r.handle&&!r.urls)||(r.platform==='instagram'&&!r.urls)){ui.study={msg:r.platform==='instagram'?'Instagram hides profiles. Paste links to their reels instead.':'Paste a TikTok or YouTube profile, or links to their videos.'};return render()}

}

function planFor(j){
  const a=j.args,st=a.as==='mine'?'My style':a.as==='defaults'?'the default style':a.as+"'s style";
  const studying=a.as.startsWith('@')&&L&&(L.styles.find(c=>c.id===a.as)||{}).studying;
  return [...(a.takes?[['Joined your clips in order','']]:[]),['Wrote down every word you said',''],['Cutting out the mistakes',''],
    ['You check the cut','The editor opens on your clip and each version lands there. Leave notes or approve.'],
    ['Captions, zooms and sound in '+st,studying?`Waits for the copy of ${a.as}'s style to finish, then starts after you approve the cut.`:'Starts after you approve the cut.']];
}
function jobBlock(j){
  const a=j.args,name=(a.edit||'').split(/[\\/]/).pop(),plan=planFor(j),R2=j.result||{};
  const steps=j.steps.map(s=>`<div class="row ${s.done?'':'cur'}"><div class="check" style="color:var(--t3);margin-top:3px">${s.done?CHECK:'<div class="spin"></div>'}</div><div class="grow"><div class="t">${esc(s.text)}</div>${!s.done&&(s.detail||s.progress!=null)?`<div class="row" style="margin-top:12px;gap:16px"><div class="prog" style="width:240px"><div style="width:${Math.round((s.progress||0)*100)}%"></div></div><span class="muted" style="color:var(--t2);font-size:14px">${s.progress!=null?Math.round(s.progress*100)+'%':''}${s.detail?(s.progress!=null?' · ':'')+esc(s.detail):''}</span></div>`:''}</div><span class="s" ${s.done?'':`data-since="${s.t}"`}>${s.done?secs(s.secs):secs(Math.max(0,Math.round(Date.now()/1000-s.t)))}</span></div>`).join('')
    +plan.slice(j.steps.length).map(([t,s])=>`<div class="row later"><div class="check" style="margin-top:5px"><div class="ring"></div></div><div><div class="t">${esc(t)}</div>${s?`<div class="muted" style="margin-top:4px;font-size:14px">${esc(s)}</div>`:''}</div></div>`).join('');
  const age=Date.now()/1000-jobStart(j),wait=j.state==='queued'?(age<20?'':S.listening?'Claude is picking this up.':`Waiting for Claude. Type ${CMD} in Terminal, or say "open the AI editor home page" in Claude Code.`):j.state==='failed'?j.error:j.state==='cancelled'?'Cancelled.':'';
  return `<div style="display:flex;flex-direction:column;gap:28px">
    <div class="row" style="gap:28px;align-items:flex-end;flex-wrap:wrap"><div class="row" style="gap:2px">${(a.paths||[a.path]).slice(0,4).map((p,i,arr)=>{const c=clipOf(p);return `<div><div class="jthumb ${arr.length>1?'n':''}" style="width:${arr.length>1?96:130}px;height:${arr.length>1?170:230}px;background:#45403C url('${esc(c.thumb||'/thumb?p='+encodeURIComponent(p))}') center/cover;border-radius:${i===0?'14px 0 0 14px':i===arr.length-1?'0 14px 14px 0':'0'}${arr.length===1?';border-radius:14px':''}"></div><div class="muted" style="margin-top:8px">${i+1}${c.duration?' · '+fmtT(c.duration):''}</div></div>`}).join('')}</div>
      <div style="padding-bottom:28px"><div style="font-size:17px;font-weight:600">${esc(name)}${(a.paths||[a.path]).every(p=>clipOf(p).duration)?' · '+fmtT((a.paths||[a.path]).reduce((t,p)=>t+clipOf(p).duration,0)):''}</div><div class="sub" style="margin-top:4px">${a.takes?'One video':'Video'} · ${esc(styleName(a.as))} · ${a.aspect==='9:16'?'Tall':'Wide'} ${a.aspect}</div></div></div>
    ${wait?`<div class="msg ${j.state==='failed'?'bad':''}" style="font-size:14px">${j.state==='failed'?CROSS:''}<span>${esc(wait)}</span></div>`:''}
    ${!R2.review_url&&(j.state==='queued'||j.state==='taken')?`<div class="starting" style="margin-top:0;max-width:560px"><div class="spin big"></div><div><b>Opening the editor...</b><span><span data-since="${jobStart(j)}">${secs(Math.max(0,Math.round(age)))}</span> · it opens on your clip while Claude cuts it</span></div></div>`:''}
    <div class="steps2">${steps}</div>
    ${R2.review_url?`<a class="btn dark" style="align-self:flex-start;height:52px;text-decoration:none;padding:0 28px" href="${esc(R2.review_url)}">Open the review page</a>`:''}

    <div class="sec"><div class="h">It copies</div>${P.copies.map(c=>`<div class="dash">${esc(c)}</div>`).join('')||'<div class="muted">Nothing measured yet.</div>'}</div>
    <div class="sec" style="flex:1"><div class="between"><span class="h">Learned from your feedback</span><span class="muted">${P.rules.length}</span></div>
      ${P.rules.map(r=>`<div class="row" style="align-items:flex-start;gap:12px"><div class="grow"><div style="font-size:14px;line-height:20px">${esc(r.rule)}</div><div class="muted" style="margin-top:3px">Said ${r.said}x${r.last?` · last ${esc(r.last)}`:''}${r.applied?` · used ${r.applied}x`:''}${r.regressions?` · came back ${r.regressions}x`:''}</div></div><button class="hlink" onclick="forgetRule(${r.id})">Forget</button></div>`).join('')||'<div class="muted" style="line-height:19px">Nothing yet. Changes here, notes on the review page and corrections in the Claude chat land here.</div>'}</div>
  </div>`;
}

function rrender(){
  rheader();
  if(rv==='settings'&&!ui.disk)loadDisk();
  const h=rv==='stylepage'?vStylePage():rv==='new'?vNew():rv==='style'?vStyle():rv==='making'?vMaking():rv==='videos'?vVideos():rv==='mystyle'?vMyStyle():rv==='settings'?vSettings():vHome();
  $('#main').innerHTML=h;$('#main').classList.toggle('spwrap',rv==='stylepage');
  if(rv==='mystyle'||rv==='style')flashBuilt();
  const o=$('#order');if(o)o.querySelectorAll('[draggable]').forEach(el=>{
    el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.i)};el.ondragover=e=>e.preventDefault();
    el.ondrop=e=>{e.preventDefault();e.stopPropagation();const a=+e.dataTransfer.getData('text/plain'),b=+el.dataset.i;if(isNaN(a)||a===b)return;const [x]=nv.sel.splice(a,1);nv.sel.splice(b,0,x);render()}});
}
window.addEventListener('drop',e=>{if(returning()&&!ui.onboard&&e.dataTransfer.files.length){const fs=[...e.dataTransfer.files],sc=fs.filter(f=>SCRIPT_EXT.test(f.name)),vs=fs.filter(f=>!SCRIPT_EXT.test(f.name));if(rv!=='new')rgo('new');if(sc.length)scriptFile(sc[0]);if(vs.length)chooseFiles(vs)}});   // a script file dropped anywhere is the script
// while files are dragged over the window: one overlay, so it is clear where they go
let dragN=0;const hasFiles=e=>[...((e.dataTransfer||{}).types||[])].includes('Files');
// The overlay lives only while files are being dragged over the window: every dragover renews a short timer,
// so a lost dragleave (the page re-renders while you drag) can never leave it stuck. Esc, drop or a click clears it.
let dragT=null;const dragOff=()=>{dragN=0;clearTimeout(dragT);document.body.classList.remove('dragging')};
window.addEventListener('dragenter',e=>{if(hasFiles(e)&&returning()&&!ui.onboard){dragN++;document.body.classList.add('dragging');clearTimeout(dragT);dragT=setTimeout(dragOff,400)}});
window.addEventListener('dragover',e=>{if(document.body.classList.contains('dragging')){clearTimeout(dragT);dragT=setTimeout(dragOff,400)}});
window.addEventListener('dragleave',e=>{if(!e.relatedTarget||(dragN&&--dragN===0))dragOff()});
for(const ev of ['drop','dragend','blur','mousedown'])window.addEventListener(ev,dragOff,true);
window.addEventListener('keydown',e=>{if(e.key==='Escape')dragOff()});
window.addEventListener('drop',()=>{dragN=0;document.body.classList.remove('dragging')},true);

// ---------------------------------------------------------------- render loop
function render(){
  if(!S)return;
  const keep=document.activeElement&&document.activeElement.id,pos=keep&&document.activeElement.selectionStart,val=keep&&document.activeElement.value;
  if(returning()&&!ui.onboard){
    if(!rv)rv=S.jobs.some(j=>j.type==='video'&&(j.state==='queued'||j.state==='taken'))&&!L.videos.some(v=>v.status!=='cutting')?(nv.making=S.jobs.filter(j=>j.type==='video'&&(j.state==='queued'||j.state==='taken')).map(j=>j.id),'making'):L.videos.length?'home':'new';
    rrender();
  }else{
  $('#steps').className='steps';Object.assign($('#live').style,{width:'',minWidth:'',maxWidth:'',whiteSpace:''});
  const auto=autoView();let v=view??auto;
  header(v);
  let html;
  if(v===0)html=h1();else if(v===1)html=h2();
  else if(v===2){const td=latest('teardown');html=!td?`<div class="col grow"><div class="empty">Pick a creator first.</div></div>`:td.state==='done'?h4(td):h3(td)}
  else if(v===3)html=h5();else html=h6();
  $('#main').innerHTML=html;
  if(keep){const e=document.getElementById(keep);if(e&&'value' in e){if(e.type!=='file')e.value=val;e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
  const d=$('#drop');if(d){d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)upload(f)}}
  }
  if(keep){const e=document.getElementById(keep);if(e&&'value' in e&&!e.matches(':focus')){if(e.type!=='file')e.value=val;e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
}
setInterval(()=>{for(const e of document.querySelectorAll('[data-since]')){const t=+e.dataset.since;if(t)e.textContent=secs(Math.max(0,Math.round(Date.now()/1000-t)))}},1000);
async function load(){
  try{const r=await fetch('/state');if(!r.ok)throw 0;S=await r.json();if(Date.now()-themeAt>3000)applyTheme(S.theme)}catch(e){const lv=$('#live');lv.className='live';lv.style.width='auto';lv.style.maxWidth='520px';lv.style.whiteSpace='normal';lv.textContent='The editor stopped. Run nextwork-editor to start it again.';return}
  // live reload: a new page version (home.html, ask.js or the Python changed) reloads this tab, keeping the view
  if(S.page){if(PV&&S.page!==PV&&canReload()){keepView();location.reload();return}PV=PV||S.page}
  const lk=S.lookup||{};
  if(!ui.look&&lk.handle){ui.look={kind:'creator',handle:lk.handle,platform:lk.platform};if(!ui.paste){ui.paste='@'+lk.handle;lbOf('paste').rows=[lk.handle]}}
  // typing in a key box: do not redraw under the cursor
  const a=document.activeElement;if(a&&a.id&&a.id.startsWith('k-')&&a.value)return returning()&&!ui.onboard?rheader():header(view??autoView());
  if(a&&a.type==='range')return;   // dragging a slider: do not redraw under the hand
  if(!L)await loadLib();
  if(rv==='stylepage')await loadStyle();
  render();openEditor();
  if(keepY!=null){window.scrollTo(0,keepY);keepY=null}
}
function openEditor(){   // Make my video: the window becomes the editor once Claude has the clip on the review page
  if(rv!=='making')return;
  const j=nv.making.map(id=>S.jobs.find(x=>x.id===id)).find(j=>j&&(j.result||{}).review_url&&j.args.edit);
  if(!j)return;
  try{if(sessionStorage.getItem('ave-opened-'+j.id))return;sessionStorage.setItem('ave-opened-'+j.id,'1')}catch(e){}
  location.href='/review?dir='+encodeURIComponent(j.args.edit);
}
let PV=null,keepY=null;
const canReload=()=>{const a=document.activeElement;return !(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.value)&&!nv.up.some(u=>!u.bad)&&!ui.edit};
function keepView(){try{sessionStorage.setItem('ave-home-keep',JSON.stringify({rv,sp:ui.sp,y:scrollY,nv:{sel:nv.sel,style:nv.style,aspect:nv.aspect,join:nv.join}}))}catch(e){}}
try{const k=JSON.parse(sessionStorage.getItem('ave-home-keep')||'null');sessionStorage.removeItem('ave-home-keep');if(k){rv=k.rv;ui.sp=k.sp;Object.assign(nv,k.nv);keepY=k.y}}catch(e){}
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
load().then(loadRecent);setInterval(load,1500);setInterval(loadLib,4000);
</script>
<script src="/ask.js"></script>
