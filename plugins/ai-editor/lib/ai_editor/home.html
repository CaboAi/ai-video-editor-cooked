:root[data-theme=dark]{--bg:#100E0E;--panel:#161413;--ink:#F2F0EB;--t2:rgba(242,240,235,.80);--t3:rgba(242,240,235,.58);--t4:rgba(242,240,235,.42);

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/20px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink);text-decoration:underline 1px;text-underline-offset:3px}
.app{display:flex;min-height:100vh}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}

.col{display:flex;flex-direction:column;flex-shrink:0}

.grid{display:flex;flex-wrap:wrap;gap:16px 12px}

.rl-pan{width:40px;height:40px;border-radius:10px!important;background:var(--tile)!important;color:var(--ink);border:1px solid var(--line)!important;display:grid;place-items:center;flex-shrink:0}
.rl-it{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0 4px!important;font-size:12px;line-height:14px;font-weight:500;color:var(--t2);text-align:center!important;flex-shrink:0;position:relative}
.rl-it .ic{width:52px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}.rl-it:hover .ic{background:var(--act)}
.rl-it.on{color:var(--ink);font-weight:600}.rl-it.on .ic{background:var(--ract)}
.rl-new .ic{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--onink)}.rl-new:hover .ic{background:var(--ink)}.rl-new{color:var(--ink);font-weight:600;gap:6px;padding-top:4px!important}
.rl-job .ic{height:36px;background:var(--panel);border:1px solid var(--line);position:relative;font-size:11px;font-weight:700;color:var(--ink)}.rl-job .ic svg{position:absolute;left:13px;top:5px}
body.rail .sb-theme{margin-top:2px}
/* components: one primary and one secondary button, small sizes, the ⋯ on a picture, the menu */
.b1,.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-size:14px;line-height:18px;font-weight:600;white-space:nowrap;flex-shrink:0;text-decoration:none}
.b1{background:var(--ink);color:var(--onink);border:0}.b1:hover{opacity:.88}
.b2{background:var(--inbg);color:var(--ink);border:1px solid var(--ring)}.b2:hover{border-color:var(--t3)}
.b1.s,.b2.s{height:32px;padding:0 12px;border-radius:8px;font-size:13px;line-height:16px}
.b1:disabled,.b2:disabled{opacity:.45;cursor:default}
.dots{position:absolute;top:6px;right:6px;z-index:2;width:28px;height:28px;border-radius:8px;border:0;padding:0;display:grid;place-items:center;background:var(--dotbg);color:var(--dotfg);box-shadow:0 1px 2px #0C0A0929;cursor:pointer}
.cmenu{background:var(--menu)!important;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0C0A091F,0 1px 2px #0C0A090F;padding:4px;min-width:220px;z-index:30}
.cmenu button{display:flex;align-items:center;gap:10px;padding:8px!important;border-radius:6px;font-size:14px!important;line-height:18px;color:var(--ink);width:100%}
.cmenu button:hover,.cmenu .hasub.on{background:var(--card)!important}
.cmenu button svg{flex-shrink:0}.cmenu button .lb{flex:1;min-width:0;text-align:left}.cmenu button .n{color:var(--t3);font-size:13px}
.cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.cmenu.top{position:fixed!important;right:auto!important;margin:0}
#menus{position:fixed;inset:0;pointer-events:none;z-index:70}#menus>*{pointer-events:auto}
.cmenu .mnote{display:flex;gap:10px;padding:8px;font-size:14px;line-height:18px;color:var(--t3);white-space:normal;max-width:260px}.cmenu .mnote svg{flex-shrink:0;margin-top:1px}.cmenu .mnote small{display:block;font-size:12px;line-height:16px;margin-top:2px}
.cmenu .mh{padding:8px 8px 4px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--t3)}
.cmenu .sub{min-width:200px;left:calc(100% + 6px);top:-5px}
.th .cmenu,.pa .cmenu{left:calc(100% - 40px);right:auto;top:38px}
.cmenu.flip{left:auto!important;right:6px!important}.cmenu.subflip .sub{left:auto;right:calc(100% + 6px)}
/* page heads and sections */
.ph{display:flex;flex-direction:column;gap:4px}
.ph h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.ph p{margin:0;font-size:15px;line-height:20px;color:var(--t2)}
.pgc{display:flex;flex-direction:column;gap:32px;min-width:0}
.sec2{display:flex;flex-direction:column;gap:12px;min-width:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;height:32px;flex-shrink:0}
.sh b{font-size:17px;line-height:22px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:0;background:none;padding:2px 4px;margin:0 0 6px -4px;border-radius:6px;font-size:15px;line-height:20px;color:var(--t2);text-decoration:underline 1px;text-underline-offset:4px;outline:1.5px solid transparent;outline-offset:-1.5px}
.back:hover{color:var(--ink)}.back.over{outline-color:var(--ink);text-decoration:none}
/* video cards: one layout for every video, tall or wide. A grid of equal columns, every card in a row the same
   height: the picture area (one height), title, meta, status, then the button pinned to the bottom at full width,
   so the buttons in a row line up. The status bar runs along the bottom (green and full when done, black while made). */
.vcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:stretch}
.vc{min-width:0;cursor:pointer}.vc.dragsrc,.dt.dragsrc{opacity:.45}
.vi{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px 14px 18px;border-radius:12px;background:var(--card);height:100%;min-width:0}
/* the picture area: a wide frame fills it; a tall frame shows whole, centred, over a blurred copy of itself */
.pa{position:relative;flex-shrink:0;height:168px;border-radius:8px;overflow:hidden;background-color:#45403C;background-image:var(--u,none);background-position:center;background-size:cover}
.pa.tall{background-image:none}
.pa.tall::before{content:"";position:absolute;inset:-20px;background:var(--u,none) center/cover;filter:blur(16px) brightness(.85)}
.pa.tall::after{content:"";position:absolute;inset:0;background:var(--u,none) center/contain no-repeat}
.vi .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.vi .nm,.vi .mt,.vi .stt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.vi .nm{font-size:16px;line-height:20px;font-weight:500;color:var(--ink)}
.vi .mt{font-size:13px;line-height:16px;color:var(--t3);margin-top:4px}
.vi .st{display:flex;flex-direction:column;align-items:stretch;gap:12px;min-width:0;margin-top:auto}
.vi .stt{font-size:13px;line-height:16px;font-weight:600;color:var(--ink)}.vi .stt.ok{color:var(--oktext)}.vi .stt span{font-variant-numeric:tabular-nums}
.vi .st>button{width:100%;overflow:hidden;text-overflow:ellipsis}
.vi .nclaude{font-size:13px;line-height:18px;min-width:0}.vi .nclaude .btn{max-width:100%;white-space:normal;height:auto;min-height:38px;padding:6px 14px}
.vi .bar{position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 12px 12px;background:var(--track);overflow:hidden}.vi .bar.ok{background:var(--ok)}
.vi .bar>i{display:block;height:4px;background:var(--ink)}.vi .bar.indet>i{width:40%;animation:slide 1.3s ease-in-out infinite}

function stepList(steps,plan,start,waiting){
  const done=steps.filter(s=>s.done),cur=steps.find(s=>!s.done);

  plan.filter(p=>!seen.has(p)).forEach(p=>rows.push(`<div class="row later"><div class="check"><div class="ring"></div></div><span class="t">${esc(p)}</span></div>`));

async function chooseFiles(files){

// ---------------------------------------------------------------- render loop
// The poll redraws every 1.5 s. Same HTML: the DOM is left alone. New HTML on the same view: every inner
// scroller (a column, panel or list) gets its scroll back, found again by its place in the tree.
// A clock's text (data-since) is left out of the comparison: the 1 s timer keeps it current, so a ticking
// clock never rebuilds the view under the pointer (a click that lands on a replaced card is lost).
const still=h=>h.replace(/(data-since="[^"]*"[^>]*>)[^<]*/g,'$1');
function paint(el,h,view){
  if(el._h!=null&&still(el._h)===still(h)&&el._v===view)return;
  const keep=[];
  if(el._v===view)(function walk(e,path){if(e.scrollTop||e.scrollLeft)keep.push([path,e.scrollTop,e.scrollLeft]);[...e.children].forEach((c,i)=>walk(c,[...path,i]))})(el,[]);
  el.innerHTML=h;el._h=h;el._v=view;
  for(const [path,t,l] of keep){const e=path.reduce((x,i)=>x&&x.children[i],el);if(e){e.scrollTop=t;e.scrollLeft=l}}
  placeMenus(el);tickClocks();
}
// Every open ⋯ menu lives in one top layer (#menus, position fixed) so no card, filter or overflow can cover
// or clip it: placed under its button, flipped left or up to stay in the window. A poll that repaints the
// same view puts it back in the same place.
function placeMenus(root){
  const layer=$('#menus');if(!layer||root===layer)return;
  for(const m of [...layer.children])if(m._root===root)m.remove();
  for(const m of root.querySelectorAll('.cmenu:not(.sub)')){
    const b=m.previousElementSibling&&m.previousElementSibling.matches('button')?m.previousElementSibling:m.parentElement.querySelector('.dots,.more2')||m.parentElement;
    m._root=root;m._btn=b;layer.appendChild(m);m.classList.add('top');placeMenu(m);
  }
}
function placeMenu(m){
  const r=m._btn.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;let x=r.left,y=r.bottom+4;
  if(x+w>innerWidth-8)x=Math.max(8,r.right-w);if(y+h>innerHeight-8)y=Math.max(8,r.top-h-4);
  m.style.left=x+'px';m.style.top=y+'px';
  const sub=m.querySelector('.cmenu.sub');m.classList.toggle('subflip',!!sub&&x+w+6+sub.offsetWidth>innerWidth-8);
  return r.bottom>0&&r.top<innerHeight;
}
