<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai editor</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#FAFAF9;--panel:#FFFFFF;--ink:#0C0A09;--t2:#57534E;--t3:#78716C;--t4:#A8A29E;--line:#E7E5E4;--soft:#F5F5F4;--ring:#D6D3D1;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/20px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink);text-decoration:underline 1px;text-underline-offset:3px}
.app{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 28px;flex-shrink:0;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px;width:260px;flex-shrink:0}
.brand b{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.01em;color:#000}
.brand span{font-size:14px;color:var(--t3)}
.steps{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:12px}
.step{display:flex;gap:8px;align-items:center;padding:7px 14px;border-radius:9px;border:0;background:none;color:var(--t4);font-size:14px;line-height:18px}
.step i{font-style:normal;font-size:13px}
.step.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 2px #0C0A0914}
.step.done{color:var(--t2)}
.step:disabled{cursor:default}
.bars{display:none}
.live{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center;justify-content:flex-end;width:260px;flex-shrink:0;font-size:13px;line-height:16px;color:var(--t3);text-align:right}
.live.on{color:var(--ink)}
.live.on::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--ink);flex-shrink:0}
main{flex:1;display:flex;gap:20px;padding:12px 20px 20px;min-height:0}
.col{display:flex;flex-direction:column;flex-shrink:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.grow{flex:1 1 0;min-width:0}
h1{margin:0;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
.lede{font-size:16px;line-height:24px;color:var(--t2);margin:14px 0 0}
.h{font-size:15px;line-height:18px;font-weight:600;color:#000}
.sub{color:var(--t2);font-size:14px;line-height:21px}
.muted{color:var(--t3);font-size:13px;line-height:16px}
.faint{color:var(--t4)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.check{width:16px;display:flex;justify-content:center;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:4px;background:var(--ink)}
.ring{width:7px;height:7px;border-radius:4px;border:1.5px solid var(--ring)}
.btn{white-space:nowrap;height:42px;padding:0 22px;border-radius:12px;border:1px solid var(--ink);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--ink);color:#fff}
.btn.quiet{border-color:var(--line);background:var(--bg);color:var(--t2);font-weight:500;padding:0 18px}
.btn:disabled{opacity:.45;cursor:default}
.wide{width:100%;height:58px;border-radius:14px;font-size:16px}
.input{height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font:13px/16px var(--mono);color:var(--ink);flex:1;min-width:0}
.input:focus{outline:none;border:1.5px solid var(--ink)}
.small{height:40px;width:96px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:500;color:var(--t2);flex-shrink:0}
.small.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.lock{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px;line-height:16px;flex-shrink:0}
.krow{display:flex;gap:28px;padding:18px 24px;border-top:1px solid var(--line)}
.krow.focus{background:var(--bg)}
.kl{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.kr{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.kname{font-size:15px;line-height:20px;font-weight:600}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--t3)}
.msg.ok,.msg.bad{color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--line);margin-top:auto}
.mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--t3)}
.big-input{display:flex;align-items:center;gap:10px;height:72px;border:1.5px solid var(--ink);border-radius:14px;background:#fff;padding:0 16px 0 22px}
.big-input input{flex:1;min-width:0;border:0;outline:0;font:20px/26px system-ui,sans-serif;background:none;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:8px;padding:5px 10px;font-size:14px;line-height:18px;flex-shrink:0;border:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;background:var(--soft);color:var(--t2);font-size:16px;display:inline-flex;gap:8px;align-items:center}
.chip.on{background:#fff;border:1.5px solid var(--ink);color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 12px;padding:0 24px}
.tile .pic{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#45403C center/cover no-repeat}
.tile .badge{position:absolute;top:8px;right:8px;background:#fff;border-radius:6px;padding:2px 7px;font-size:13px;font-weight:600;line-height:18px}
.tile .views{position:absolute;left:10px;bottom:9px;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 3px #0008}
.tile .cap{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);margin-top:6px}
.tile .cap span:last-child{color:var(--t4)}
.mrow{display:grid;grid-template-columns:134px 1fr;gap:0 0;padding:14px 20px;border-radius:14px}
.mrow .k{color:var(--t3);font-size:14px}
.mrow .v{font-size:17px;line-height:26px;color:var(--t2)}
.mrow.now{background:var(--soft)}
.mrow.now .k{color:var(--ink);font-weight:600}
.mrow.now .v{color:var(--ink)}
.mrow.next .v,.mrow.next .k{color:var(--t4)}
.slist{display:flex;flex-direction:column;gap:13px;font-size:14px;line-height:18px}
.slist .row{gap:12px}
.slist .t{flex:1;color:var(--t2)}
.slist .s{color:var(--t4);font-size:13px}
.slist .cur .t{color:#000;font-weight:600}
.slist .later .t{color:var(--t4)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;width:166px;flex-shrink:0}
.prog div{height:4px;background:var(--ink)}
.cost{border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.cost .between{font-size:14px;color:var(--t2)}
.cost b{color:var(--ink)}
.strip{display:grid;gap:10px;padding:14px 24px;border:1px solid var(--line);border-radius:16px;background:#fff}
.strip .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.strip .bar div{height:6px;background:var(--ink)}
.strip span{font-size:13px;color:var(--t3)}
.strip .cur span{color:#000;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats>div{padding:24px 0 22px 28px;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font-size:56px;line-height:60px;font-weight:700;letter-spacing:-.03em}
.stats span{color:var(--t2);font-size:14px}
.facts{display:grid;grid-template-columns:110px 1fr;gap:14px 26px;font-size:15px;line-height:22px}
.facts .k{color:var(--t3);font-size:14px}
.facts .k.b{color:var(--ink);font-weight:600}
.pick{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ring);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.pick.on .box{border-color:var(--ink)}
.pick .ttl{font-weight:600;font-size:15px}
.pick:not(.on) .ttl{font-weight:400;color:var(--t2)}
.dash{display:flex;gap:14px;font-size:14px;line-height:19px;color:var(--t2);padding:6px 0}
.dash::before{content:"";width:10px;height:1.5px;background:var(--t3);margin-top:9px;flex-shrink:0}
.prompt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 28px;border-top:1px solid var(--line)}
.prompt code{font:15px/20px var(--mono);color:#000}
.copy{height:40px;min-width:92px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--t2);flex-shrink:0}
.tool{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.drop{flex:1;border:1.5px dashed var(--ring);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:280px;background:none;width:100%}
.drop.over{border-color:var(--ink);background:#fff}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px}
.seg button{flex:1;height:40px;border:0;border-radius:9px;background:none;color:var(--t3);font-size:15px}
.seg button.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 2px #0C0A0914}
.file{display:flex;align-items:center;gap:16px;border:1.5px solid var(--ink);border-radius:16px;padding:14px 20px;background:#fff}
.empty{color:var(--t3);font-size:14px;line-height:21px;padding:24px}
.hide{display:none!important}
.logo{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--t2)}
/* returning user: New video, Pick a style, Making, Home, Your videos, My style, Settings (Paper "J launcher + pick") */
.tabs{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:12px}
.tabs button{padding:7px 16px;border-radius:9px;border:0;background:none;color:var(--t4);font-size:14px;line-height:18px}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600}
.hlink{border:0;background:none;color:var(--t3);font-size:13px;line-height:16px;padding:0}
.pill{border-radius:999px;padding:7px 14px;background:var(--soft);color:#44403C;font-size:13px;line-height:16px;border:1px solid transparent}
.pill.on{background:#fff;border-color:var(--ink);color:var(--ink);font-weight:500;padding:6px 13px}
.choose{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--ring);border-radius:10px;background:#fff;font-weight:500;cursor:pointer;flex-shrink:0}
.grid{display:flex;flex-wrap:wrap;gap:16px 12px}
.clip{width:108px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left}
.clip .pic{position:relative;width:108px;height:192px;border-radius:10px;overflow:hidden;background:#45403C center/cover no-repeat}
.clip.on .pic{outline:2px solid var(--ink);outline-offset:2px}
.clip .ring2{position:absolute;right:7px;top:7px;width:20px;height:20px;border-radius:10px;border:1.5px solid #fff;background:#0C0A0940}
.clip .num{position:absolute;right:6px;top:6px;height:22px;border-radius:11px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:3px;padding:0 7px 0 6px;font-size:12px;font-weight:700}
.clip .dur{position:absolute;left:7px;bottom:6px;color:#fff;font-size:11px;font-weight:600;line-height:14px;text-shadow:0 1px 3px #0009}
.clip .nm{font-size:12px;line-height:16px;font-weight:500;color:#292524;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.on .nm{font-weight:600;color:var(--ink)}
.clip .wh{font-size:12px;line-height:16px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.droptile{width:108px;height:192px;border:1.5px dashed var(--ring);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 10px;text-align:center;flex-shrink:0;cursor:pointer}
.droptile.over{border-color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:12px;padding:20px 24px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:22px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;width:100%}
.opt.on{border:1.5px solid var(--ink)}
.radio{width:18px;height:18px;border-radius:9px;border:1.5px solid var(--ring);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.on>.radio,.radio.on{border-color:var(--ink)}.on>.radio::after,.radio.on::after{content:"";width:9px;height:9px;border-radius:5px;background:var(--ink)}
.rec{background:var(--soft);border-radius:999px;padding:2px 8px;font-size:12px;line-height:16px;color:var(--t2)}
.order{display:flex;gap:10px;flex-wrap:wrap}
.order>div{flex:1 1 120px;display:flex;align-items:center;gap:10px;padding:8px;background:var(--soft);border-radius:12px;cursor:grab;min-width:0}
.order .th{width:36px;height:64px;border-radius:6px;background:#45403C center/cover;flex-shrink:0}
.shape{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}
.shape.on{border:1.5px solid var(--ink)}
.shape i{display:block;border:2px solid var(--t4);border-radius:4px}.shape.on i{border-color:var(--ink)}
.go{height:52px;border-radius:14px;background:var(--ink);color:#fff;border:0;font-size:16px;font-weight:600;width:100%}
.go:disabled{opacity:.4;cursor:default}
.scard{width:300px;flex-shrink:0;border:1px solid var(--line);border-radius:20px;background:#fff;padding:12px;display:flex;flex-direction:column;text-align:left;cursor:pointer}
.scard.on{border:1.5px solid var(--ink);padding:11.5px}
.scard .pic{position:relative;height:340px;border-radius:14px;overflow:hidden;background:#45403C center/cover no-repeat}
.cap{position:absolute;left:8%;right:8%;text-align:center;font-weight:600;font-size:21px;line-height:27px;transform:translateY(-50%)}
.capsm .cap{font-size:12px;line-height:16px}
.cap span{padding:2px 10px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.scard .studying{position:absolute;inset:auto 12px 12px 12px;background:#fffffff0;border-radius:10px;padding:8px 10px;font-size:13px}
.frow{display:flex;justify-content:space-between;gap:10px;font-size:13px;line-height:18px;padding:3px 0}
.frow span:first-child{color:var(--t3)}.frow span:last-child{color:var(--ink);text-align:right}
.create{flex:1 1 360px;min-width:300px;border:1.5px dashed var(--ring);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.box2{border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px 18px}
.bar2{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid var(--line);border-radius:20px;background:#fff;padding:14px 14px 14px 24px}
.steps2{display:flex;flex-direction:column;gap:22px;max-width:560px}
.steps2 .row{align-items:flex-start;gap:16px}
.steps2 .t{font-size:16px;line-height:22px;color:var(--t2)}
.steps2 .cur .t{color:#000;font-weight:600}
.steps2 .later .t{color:var(--t3)}
.steps2 .s{margin-left:auto;color:var(--t4);font-size:14px}
.vrow{display:flex;align-items:center;gap:20px;padding:14px 0;border-top:1px solid var(--line)}
.vrow .th{width:50px;height:88px;border-radius:6px;background:#45403C center/cover;flex-shrink:0}
.vrow .st{width:170px;flex-shrink:0;display:flex;align-items:center;gap:8px;font-size:14px}
.vrow .act{width:150px;flex-shrink:0;display:flex;justify-content:center}
.btn.sm{height:38px;padding:0 18px;font-size:14px}
.ini{width:36px;height:36px;border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--t2);flex-shrink:0}
.kv{display:flex;flex-direction:column;gap:2px}.kv span{font-size:13px;color:var(--t3)}.kv b{font-weight:500;font-size:15px}
.codebox{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:10px;padding:10px 14px;font:14px var(--mono)}
.confirm{border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:10px}
@media (max-width:1100px){.rv-side{width:400px!important}}
@media (max-width:760px){.tabs{order:3;width:100%}.tabs button{flex:1}.rv-side{width:auto!important}.scard{width:100%}.vrow .st,.vrow .act{width:auto}.vrow{flex-wrap:wrap}.bar2{flex-direction:column;align-items:stretch}}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:760px){
  header{height:auto;flex-wrap:wrap;padding:14px 16px 0;gap:10px}
  .brand{width:auto}.live{width:auto;margin-left:auto}
  .steps{display:none}.bars{display:flex;gap:6px;width:100%}
  .bars div{flex:1;height:4px;border-radius:2px;background:var(--line)}.bars .done{background:var(--t4)}.bars .on{background:var(--ink)}
  main{flex-direction:column;padding:12px 16px 20px}
  .col{width:auto!important;padding:0!important}
  h1{font-size:32px;line-height:36px}
  .krow{flex-direction:column;gap:12px;padding:16px}.kl{width:auto}
  .tiles{grid-template-columns:repeat(2,1fr);padding:0 16px}
  .stats{grid-template-columns:1fr 1fr}.stats>div:nth-child(3){border-left:0;padding-left:0}
  .stats>div:nth-child(n+3){border-top:1px solid var(--line)}.stats b{font-size:40px;line-height:48px}
  .facts{grid-template-columns:1fr;gap:4px}
  .mrow{grid-template-columns:1fr}
  .side,.panel[style*="width:400px"]{width:auto!important}
  .pair{flex-direction:column;gap:20px!important}.thumb{width:160px!important}
  .best{grid-template-columns:1fr!important}
  .live{max-width:60vw;display:block}
  .foot{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><b>ai editor</b><span id="who">first run</span></div>
  <nav class="steps" id="steps"></nav>
  <div class="live" id="live"></div>
  <div class="bars" id="bars"></div>
</header>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.2l2.6 2.6L10 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  $('#bars').innerHTML=STEPS.map((s,i)=>`<div class="${i===v?'on':i<v?'done':''}"></div>`).join('');
  const td=latest('teardown');

  const live=$('#live');let t='',on=false;

  const setup=latest('setup');
  if(busy&&busy.state==='queued')t=S.listening?'Claude is picking this up':'Waiting for Claude. Type nextwork-editor in Terminal.';
  else if(busy){const s=busy.steps.at(-1),m=s&&/video \d+ of \d+/.exec(s.detail||'');t=m?`Claude is measuring ${m[0]}`:s?`Claude: ${s.text}`:'Claude is on it';on=true}

  else if(v===2&&td&&td.state==='done'){t=`Done in ${secs(Math.round(td.finished-td.started))}`}
  else if(v===4&&td&&td.state==='done'){const sk=latest('skill');t='Style: '+((sk&&sk.result.name)||'@'+td.args.handle)}

}

    <div class="sec"><div class="h">Its skill</div><div style="font:500 18px var(--mono)">${esc(P.skill.name)}</div>
      <div class="mono" title="${esc(P.skill.path)}">${esc(midEll(P.skill.path,48))}</div>
      <div class="row"><button class="btn quiet sm" onclick="post('/style/reveal',{id:ui.sp}).then(loadStyle)">Open the skill file</button>${P.skill.exists?'':'<span class="muted">made on first open</span>'}</div>
      <div class="muted" style="color:var(--t2);line-height:19px">Say "/${esc(P.skill.name)}" in Claude Code to edit a video in this style.</div></div>
    <div class="sec"><div class="h">It copies</div>${P.copies.map(c=>`<div class="dash">${esc(c)}</div>`).join('')||'<div class="muted">Nothing measured yet.</div>'}</div>
    <div class="sec" style="flex:1"><div class="between"><span class="h">Learned from your feedback</span><span class="muted">${P.rules.length}</span></div>
      ${P.rules.map(r=>`<div class="row" style="align-items:flex-start;gap:12px"><div class="grow"><div style="font-size:14px;line-height:20px">${esc(r.rule)}</div><div class="muted" style="margin-top:3px">Said ${r.said}x${r.last?` · last ${esc(r.last)}`:''}${r.applied?` · used ${r.applied}x`:''}${r.regressions?` · came back ${r.regressions}x`:''}</div></div><button class="hlink" onclick="forgetRule(${r.id})">Forget</button></div>`).join('')||'<div class="muted" style="line-height:19px">Nothing yet. Changes here, notes on the review page and corrections in the Claude chat land here.</div>'}</div>
  </div>`;
}

function rrender(){
  rheader();
  if(rv==='settings'&&!ui.disk)loadDisk();
  const h=rv==='stylepage'?vStylePage():rv==='new'?vNew():rv==='style'?vStyle():rv==='making'?vMaking():rv==='videos'?vVideos():rv==='mystyle'?vMyStyle():rv==='settings'?vSettings():vHome();
  $('#main').innerHTML=h;
  const o=$('#order');if(o)o.querySelectorAll('[draggable]').forEach(el=>{
    el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.i)};el.ondragover=e=>e.preventDefault();
    el.ondrop=e=>{e.preventDefault();e.stopPropagation();const a=+e.dataTransfer.getData('text/plain'),b=+el.dataset.i;if(isNaN(a)||a===b)return;const [x]=nv.sel.splice(a,1);nv.sel.splice(b,0,x);render()}});
}
window.addEventListener('drop',e=>{if(returning()&&!ui.onboard&&e.dataTransfer.files.length){if(rv!=='new')rv='new';chooseFiles(e.dataTransfer.files)}});

// ---------------------------------------------------------------- render loop
function render(){
  if(!S)return;
  const keep=document.activeElement&&document.activeElement.id,pos=keep&&document.activeElement.selectionStart,val=keep&&document.activeElement.value;
  if(returning()&&!ui.onboard){
    if(!rv)rv=S.jobs.some(j=>j.type==='video'&&(j.state==='queued'||j.state==='taken'))&&!L.videos.some(v=>v.status!=='cutting')?(nv.making=S.jobs.filter(j=>j.type==='video'&&(j.state==='queued'||j.state==='taken')).map(j=>j.id),'making'):L.videos.length?'home':'new';
    rrender();
  }else{
  $('#steps').className='steps';Object.assign($('#live').style,{width:'',minWidth:'',maxWidth:'',whiteSpace:''});
  const auto=autoView();let v=view??auto;
  header(v);
  if(returning())$('#who').innerHTML=`<button class="hlink" style="font-size:14px" onclick="rgo('home')">‹ Back to your videos</button>`;
  let html;
  if(v===0)html=h1();else if(v===1)html=h2();
  else if(v===2){const td=latest('teardown');html=!td?`<div class="col grow"><div class="empty">Pick a creator first.</div></div>`:td.state==='done'?h4(td):h3(td)}
  else if(v===3)html=h5();else html=h6();
  $('#main').innerHTML=html;
  if(keep){const e=document.getElementById(keep);if(e&&'value' in e){if(e.type!=='file')e.value=val;e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
  const d=$('#drop');if(d){d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)upload(f)}}
  }
  if(keep){const e=document.getElementById(keep);if(e&&'value' in e&&!e.matches(':focus')){if(e.type!=='file')e.value=val;e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
}
async function load(){
  try{const r=await fetch('/state');if(!r.ok)throw 0;S=await r.json()}catch(e){const lv=$('#live');lv.className='live';lv.style.width='auto';lv.style.maxWidth='520px';lv.style.whiteSpace='normal';lv.textContent='The editor stopped. Run nextwork-editor to start it again.';return}
  const lk=S.lookup||{};
  if(!ui.look&&lk.handle){ui.look={kind:'creator',handle:lk.handle,platform:lk.platform};if(!ui.paste)ui.paste='@'+lk.handle}
  // typing in a key box: do not redraw under the cursor
  const a=document.activeElement;if(a&&a.id&&a.id.startsWith('k-')&&a.value)return header(view??autoView());
  if(a&&a.type==='range')return;   // dragging a slider: do not redraw under the hand
  if(!L)await loadLib();
  if(rv==='stylepage')await loadStyle();
  render();
}
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
load().then(loadRecent);setInterval(load,1500);setInterval(loadLib,4000);
</script>
</body>
</html>
